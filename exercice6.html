<!DOCTYPE html>
<html>
<head>
    <title>Exercice 6 - Nommage et débogage</title>
</head>
<body>
    <h1>Exercice 6</h1>
    <p>Ouvrez la console pour voir les résultats (F12)</p>

    <script>
       
        let premierPrix = 100;        
        
        let deuxiemePrix = 80;         
        
        let prixMinimum = 50;           
        
        let prixQuatre = 200;           
        
        let prixMaximum = 300;           
        
        let prixMoyen = (premierPrix + deuxiemePrix + prixMinimum + prixQuatre + prixMaximum) / 5;
        
        console.log("Prix moyen : " + prixMoyen);
        console.log("Le prix minimum est : " + prixMinimum);
        console.log("Le prix maximum est : " + prixMaximum);
        
        console.log("Détail des prix :", premierPrix, deuxiemePrix, prixMinimum, prixQuatre, prixMaximum);
    </script>
</body>
</html>
